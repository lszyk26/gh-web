# ============================================================
# nginx 反向代理模板（可选）
#
# 适用场景：你已经有 nginx，想让 nginx 负责 TLS / 域名 / 限流，
#           Node 只监听 127.0.0.1:8787。
#
#   1. 把下面的 server_name 改成你的域名
#   2. cp deploy/nginx-proxy.conf /etc/nginx/conf.d/zz-gh-web.conf
#   3. nginx -t && systemctl reload nginx
#
# 证书可用 certbot：
#   certbot --nginx -d gh.example.com
# ============================================================

# ---------- 80：跳转 HTTPS + ACME ----------
server {
    listen 80;
    listen [::]:80;
    server_name gh.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：反代到 Node ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gh.example.com;

    ssl_certificate     /etc/letsencrypt/live/gh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gh.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 评论、Issue 正文可能较长
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 让 Node 知道外面是 HTTPS，从而给 Cookie 加 Secure
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
