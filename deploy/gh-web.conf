# ============================================================
# gh.0lt.top —— GH·WEB（只读镜像，仅本人使用）
#
#   静态 SPA 本地直出  +  api.github.com 只读缓存层
#
#   关键性质：
#     · token 只存在浏览器 localStorage，服务端不接触、不打日志
#     · 缓存按 Authorization 分桶，不会串号
#     · 全站 basic auth（.ghweb.htpasswd）—— URL 一旦外泄也无从进入
# ============================================================

# 限流区：拦暴力猜口令（http 上下文）
limit_req_zone $binary_remote_addr zone=ghweb:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ghapi:10m rate=6r/s;

# API 响应缓存区：只缓存 GET/HEAD，200MB，闲置 7 天回收
proxy_cache_path /var/cache/nginx/gh-api
                 levels=1:2
                 keys_zone=gh_api:20m
                 max_size=200m
                 inactive=7d
                 use_temp_path=off;

upstream gh_api_upstream {
    server api.github.com:443;
    keepalive 16;
    keepalive_requests 200;
    keepalive_timeout 60s;
}

# 缓存键必须包含凭证 → 不同 token 各自独立，绝不串号。
# 用前端算好的摘要（X-GH-Cache-Bucket）而不是原始 token：
#   nginx 会把缓存键明文写进磁盘缓存文件，原始 token 绝不能出现在里面。
map $http_x_gh_cache_bucket $gh_cache_key {
    default   "$http_x_gh_cache_bucket";
    ""        "anon";
}

# ---------- 80：仅用于 ACME 挑战 ----------
server {
    listen 80;
    listen [::]:80;
    server_name gh.0lt.top;

    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        auth_basic off;
        allow all;
    }
    location / { return 301 https://$host$request_uri; }
}

# ---------- 443：主站 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gh.0lt.top;

    # 自用：不写访问日志（basic auth 用户名、请求路径都不留痕）
    access_log off;

    ssl_certificate     /etc/letsencrypt/live/gh.0lt.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gh.0lt.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/gh-web/web;
    index index.html;

    limit_req zone=ghweb burst=40 nodelay;

    # ACME 挑战必须免鉴权，否则续期会失败
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        auth_basic off;
        allow all;
    }

    # 静态资源：本地直出，7 天强缓存
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|ico|webp)$ {
        auth_basic "gh-web";
        auth_basic_user_file /etc/nginx/.ghweb.htpasswd;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 入口
    location / {
        auth_basic "gh-web";
        auth_basic_user_file /etc/nginx/.ghweb.htpasswd;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ---------- GitHub API 缓存层 ----------
    # 前端请求 /api/xxx  →  翻成 https://api.github.com/xxx
    location /api/ {
        auth_basic "gh-web";
        auth_basic_user_file /etc/nginx/.ghweb.htpasswd;

        limit_req zone=ghapi burst=20 nodelay;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass https://gh_api_upstream;

        proxy_ssl_server_name on;
        proxy_ssl_name api.github.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "gh-web/1.0";

        # 自定义头 → 标准 Bearer 头（不能直接收 Authorization，那是 basic auth 的地盘）
        proxy_set_header Authorization "";
        proxy_set_header Authorization "Bearer $http_x_gh_token";
        # 内部头不转发给 GitHub（token 已翻成 Authorization）
        proxy_set_header X-GH-Token "";
        proxy_set_header X-GH-Cache-Bucket "";

        # === 缓存策略 ===
        proxy_cache gh_api;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "gh|$gh_cache_key|$request_method|$uri$is_args$args";
        # GitHub 的响应带 Cache-Control: private，必须显式忽略才会缓存
        proxy_ignore_headers Cache-Control Set-Cookie Vary Expires X-Accel-Expires;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 301 302 1m;
        proxy_cache_valid 404 1m;
        proxy_cache_valid any 30s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_age 10s;
        proxy_cache_lock_timeout 10s;
        proxy_cache_revalidate on;
        proxy_cache_bypass $arg_nocache;

        # 命中情况回传前端（顶栏会显示本次会话命中率）
        add_header X-GHW-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;

        proxy_intercept_errors off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
