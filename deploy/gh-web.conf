# ============================================================
# __DOMAIN__ —— GH·WEB（只读镜像，自用）
#
# 本文件是模板：__DOMAIN__ 与 __ROOT__ 由 deploy/install.sh 渲染替换。
#
#   静态 SPA 本地直出  +  api.github.com 只读缓存层
#
#   关键性质：
#     · token 只存在浏览器 localStorage，服务端不接触、不打日志
#     · 缓存按 Authorization 分桶，不会串号
#     · 全站 basic auth（.ghweb.htpasswd）—— URL 一旦外泄也无从进入
# ============================================================

# 限流区（http 上下文）
#   ghweb —— 只用于拦「猜口令」。首屏要并发拉 31 个资源，速率必须给足，
#            否则自己人正常访问就会吃 503。burst 也要留够余量。
#   ghapi —— 防止手滑把 GitHub 的 5000/h 额度打穿。
limit_req_zone $binary_remote_addr zone=ghweb:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ghapi:10m rate=6r/s;

# 限流命中时返回 429 而不是 503：既能和「服务不可用」区分开，
# 也避免浏览器把 503 当成服务器故障而重试、进一步放大压力。
limit_req_status 429;

# API 响应缓存区：只缓存 GET/HEAD，200MB，闲置 7 天回收
proxy_cache_path /var/cache/nginx/gh-api
                 levels=1:2
                 keys_zone=gh_api:20m
                 max_size=200m
                 inactive=7d
                 use_temp_path=off;

upstream gh_api_upstream {
    server api.github.com:443;
    keepalive 16;
    keepalive_requests 200;
    keepalive_timeout 60s;
}

# 缓存键必须包含凭证 → 不同 token 各自独立，绝不串号。
# 用前端算好的摘要（X-GH-Cache-Bucket）而不是原始 token：
#   nginx 会把缓存键明文写进磁盘缓存文件，原始 token 绝不能出现在里面。
map $http_x_gh_cache_bucket $gh_cache_key {
    default   "$http_x_gh_cache_bucket";
    ""        "anon";
}

# 免密认证服务（127.0.0.1:9093）
upstream ghweb_auth { server 127.0.0.1:9093; keepalive 8; }

# 供主站 auth_request 内部调用
server {
    listen 127.0.0.1:8099;
    server_name _;
    access_log off;
    location = /_verify { proxy_pass http://ghweb_auth/_verify; }
    location / { return 403; }
}

# ---------- 80：仅用于 ACME 挑战 ----------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        auth_basic off;
        allow all;
    }
    # 认证端点必须在 80 上可达（且不跳 301）：
    # 免密 Cookie 走 HTTPS 下发，但用户若从 http:// 进来，至少能走到登录页。
    location ~ ^/(login|logout|_verify)$ { proxy_pass http://ghweb_auth; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- 443：主站 ----------
server {
    # nginx 1.24 用 listen 上的 http2 参数；独立的 `http2 on;` 指令要 1.25.1+ 才认
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # 自用：不写访问日志（basic auth 用户名、请求路径都不留痕）
    access_log off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root __ROOT__/web;
    index index.html;

    # burst 必须覆盖首屏并发量（约 31 个资源），给到 100 留足余量
    limit_req zone=ghweb burst=100 nodelay;

    # ---------- 免密登录端点（必须免鉴权，否则登录页自身也被拦） ----------
    location ~ ^/(login|logout|_verify)$ {
        auth_basic off;
        proxy_pass http://ghweb_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    # ACME 挑战必须免鉴权，否则续期会失败
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        auth_basic off;
        allow all;
    }

    # 静态资源：本地直出，7 天强缓存。
    # 只写一条 Cache-Control —— 此前 expires 与 add_header 同时存在会发出
    # 两条 Cache-Control（一条 max-age、一条 immutable），不同客户端解析
    # 结果不一致，缓存行为变得不可预测。
    # 资源失效靠 index.html 里的 ?v= 版本号（query 不参与 location 匹配）。
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|ico|webp)$ {
        # 两种进入方式任选其一（satisfy any）：
        #   · 免密：浏览器带着 1 年有效的 ghw_s Cookie → auth_request 返回 204
        #   · 兜底：原 basic auth 密码（认证服务故障时仍能进站，不会把自己锁在外面）
        satisfy any;
        auth_request /_verify;
        error_page 401 = @ghw_gate;
        auth_basic "gh-web";
        auth_basic_user_file /etc/nginx/.ghweb.htpasswd;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    # SPA 入口
    location / {
        # 两种进入方式任选其一（satisfy any）：
        #   · 免密：浏览器带着 1 年有效的 ghw_s Cookie → auth_request 返回 204
        #   · 兜底：原 basic auth 密码（认证服务故障时仍能进站，不会把自己锁在外面）
        satisfy any;
        auth_request /_verify;
        error_page 401 = @ghw_gate;
        auth_basic "gh-web";
        auth_basic_user_file /etc/nginx/.ghweb.htpasswd;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ---------- GitHub API 缓存层 ----------
    # 前端请求 /api/xxx  →  翻成 https://api.github.com/xxx
    location /api/ {
        # 两种进入方式任选其一（satisfy any）：
        #   · 免密：浏览器带着 1 年有效的 ghw_s Cookie → auth_request 返回 204
        #   · 兜底：原 basic auth 密码（认证服务故障时仍能进站，不会把自己锁在外面）
        satisfy any;
        auth_request /_verify;
        error_page 401 = @ghw_gate;
        auth_basic "gh-web";
        auth_basic_user_file /etc/nginx/.ghweb.htpasswd;

        limit_req zone=ghapi burst=20 nodelay;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass https://gh_api_upstream;

        proxy_ssl_server_name on;
        proxy_ssl_name api.github.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "gh-web/1.0";

        # 自定义头 → 标准 Bearer 头（不能直接收 Authorization，那是 basic auth 的地盘）
        proxy_set_header Authorization "";
        proxy_set_header Authorization "Bearer $http_x_gh_token";
        # 内部头不转发给 GitHub（token 已翻成 Authorization）
        proxy_set_header X-GH-Token "";
        proxy_set_header X-GH-Cache-Bucket "";

        # === 缓存策略 ===
        proxy_cache gh_api;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "gh|$gh_cache_key|$request_method|$uri$is_args$args";
        # GitHub 的响应带 Cache-Control: private，必须显式忽略才会缓存
        proxy_ignore_headers Cache-Control Set-Cookie Vary Expires X-Accel-Expires;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 301 302 1m;
        proxy_cache_valid 404 1m;
        proxy_cache_valid any 30s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_age 10s;
        proxy_cache_lock_timeout 10s;
        proxy_cache_revalidate on;
        proxy_cache_bypass $arg_nocache;

        # 命中情况回传前端（顶栏会显示本次会话命中率）
        add_header X-GHW-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;

        proxy_intercept_errors off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # 未通过鉴权 → 送去本站登录页（不再弹浏览器原生密码框）
    location @ghw_gate { return 302 /login; }
}
